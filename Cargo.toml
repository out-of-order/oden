[workspace]
members = ["crates/comrak-gpui", "crates/oden-app", "crates/oden-core", "crates/oden-graph"]
resolver = "2"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
gpui = { package = "gpui-pre", version = "0.3.9" }
gpui_platform = { package = "gpui-pre-platform", version = "0.3.1", features = ["font-kit"] }
gpui-component = { git="https://github.com/out-of-order/gpui-component", rev = "bc34071",features = ["tree-sitter-languages"] }
gpui-base = { git="https://github.com/out-of-order/gpui-component", rev = "bc34071" }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = { version = "0.1.44" }
serde_json = "1"
merman = { version = "=0.9.3", default-features = false, features = [
    "diagram-class",
    "diagram-er",
    "diagram-flowchart",
    "diagram-gantt",
    "diagram-git-graph",
    "diagram-journey",
    "diagram-mindmap",
    "diagram-pie",
    "diagram-quadrant-chart",
    "diagram-sequence",
    "diagram-state",
    "diagram-timeline",
    "diagram-xychart",
    "layout-cytoscape",
    "svg",
] }
